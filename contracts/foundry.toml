[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.19"
# Pre-PUSH0 (EIP-3855) — Filecoin FEVM doesn't implement PUSH0 yet, and
# 0.8.19 is the last solc version that doesn't emit it. Pinning here also
# silences forge's "Unsupported Chain IDs: 314" warning.
evm_version = "paris"
optimizer = true
optimizer_runs = 200

# This contract is a view-only helper for the glifio/invariants tool.
# No tests, no scripts that touch state — only reads.

[fmt]
line_length = 100
